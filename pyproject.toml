[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "artinium-local"
version = "0.2.0"
description = "A context-efficient local coding agent for Ollama (beta)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artinium contributors" }]
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
  "httpx>=0.27,<1",
  "textual>=0.80,<2",
]

[project.scripts]
artinium = "artium.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["artium"]
